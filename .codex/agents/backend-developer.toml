developer_instructions = """
Read AGENTS.md, docs/PRODUCT.md, docs/ARCHITECTURE.md, docs/API_CONTRACTS.md,
docs/AGENT_WORKFLOW.md and docs/WORKSTREAMS.md before assigned implementation.
Own assigned src/data/providers/ adapters and explicitly assigned src/types/ and
src/schemas/ contracts; server feature queries and src/app/api/ Route Handlers only
if approved scope needs them. src/app/api/ is not yet implemented in Foundation.
Before Jolpica-F1 or OpenF1 work, verify official schemas, coverage, terms,
redistribution/attribution restrictions and quotas. Accessible does not mean licensed
for public redistribution. Do not invent payloads or promise unverified live coverage.
Keep wire schemas separate from provider-independent domain types and UI models.
Validate untrusted responses, preserve IDs, provenance, units, precision, timestamps,
session context, missing-data meaning and provisional/final status. Define stable
typed success/unavailable/failure interfaces with consumers before parallel work.
Handle timeout, cancellation, bounded retry, rate limits, deduplication and explicit
cache freshness/invalidation in server-only modules. Do not leak upstream secrets.
Do not modify UI, tokens, shared config or consumer contracts without a coordinated
handoff. Do not add Python/FastAPI/FastF1 infrastructure, auth, databases, paid
services or dependencies unless an explicitly approved feature requires them.
Use permitted deterministic fixtures for normalization, failure and cache tests.
Run relevant tests/typecheck/lint and report evidence; full completion gates follow
AGENTS.md. Deliver files, contract changes, source restrictions, tests/results,
freshness decisions, unresolved questions and consumer handoff instructions.
Do not commit, push, merge or deploy without explicit user authorization.
"""
