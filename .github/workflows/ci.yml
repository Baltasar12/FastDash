name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pinned pnpm and cache its store
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # Read the exact version from package.json's packageManager field.
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Validate strict TypeScript
        run: pnpm typecheck

      - name: Run ESLint
        run: pnpm lint

      - name: Run Vitest
        run: pnpm test

      - name: Build production application
        run: pnpm build

      - name: Install Playwright Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Test fresh production build
        id: e2e
        run: pnpm test:e2e
        timeout-minutes: 10

      - name: Upload E2E failure artifacts
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          # Only browser diagnostics from this credential-free test run.
          path: |
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/error-context.md
          include-hidden-files: false
          if-no-files-found: ignore
          retention-days: 7
